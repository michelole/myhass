      command: Set the air purifier to {{ mode }} mode
    enabled: true
  - action: fan.turn_on
    metadata: {}
    target:
      entity_id: fan.air_purifier
    data: {}
    enabled: false
  - action: fan.set_preset_mode
    metadata: {}
    target:
      entity_id: fan.air_purifier
    data: {}
    enabled: false
  alias: Air Purifier
  description: ''
