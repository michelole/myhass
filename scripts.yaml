turn_off_light_sources:
  alias: Turn off indicator lights
  sequence:
  - data:
      value: 0
    target:
      entity_id: input_number.brightness
    action: input_number.set_value
  - action: light.turn_off
    metadata: {}
    data: {}
    target:
      entity_id: light.indicator_lights
  - data:
      value: ' '
    target:
      entity_id: input_text.matrix_text
    action: input_text.set_value
  mode: single
  description: ''
'1662823079659':
  alias: Confirmable Notification
  use_blueprint:
    path: homeassistant/confirmable_notification.yaml
    input:
      notify_device: 767a88b4bbfa96f0ae264f19506b392a
      title: Title
      message: Body
'1662825053499':
  alias: Mobile Notification
  sequence:
  - action: notify.send_message
    metadata: {}
    target:
      entity_id: notify.pixel_10
    data:
      message: '{{body}}'
      title: '{{title}}'
  mode: single
  fields:
    body:
      selector:
        text:
      name: 'Body '
      required: true
    title:
      selector:
        text:
      name: Title
clean_room:
  alias: Clean Room
  sequence:
  - service: vacuum.send_command
    target:
      entity_id: vacuum.roborock_s5_max
    data:
      command: app_segment_clean
      params:
      - segments:
        - '{% set dict = { ''Bathroom'':22, ''Bedroom'':21, ''Corridor'':24, ''Kitchen'':
          25, ''Living Room'':18, ''Loggia'':20 } %} {% set my_room = room %} {{dict[my_room]}}

          '
        repeat: '{{repeat}}'
  mode: single
  fields:
    repeat:
      selector:
        number:
          min: 1
          max: 3
          step: 1
      default: 1
      name: repeat
    room:
      selector:
        select:
          options:
          - Bathroom
          - Bedroom
          - Corridor
          - Kitchen
          - Living Room
          - Loggia
      required: true
clean_room_if_day:
  alias: Clean Room If Day
  sequence:
  - if:
    - condition: time
      after: input_datetime.wake_time
      before: input_datetime.evening_time
    then:
    - service: script.clean_room
      metadata: {}
      data:
        repeat: '{{repeat}}'
        room: '{{room}}'
  mode: single
  fields:
    repeat:
      selector:
        number:
          min: 1
          max: 3
          step: 1
      default: 1
      name: repeat
    room:
      selector:
        select:
          options:
          - Bathroom
          - Bedroom
          - Corridor
          - Kitchen
          - Living Room
          - Loggia
      required: true
