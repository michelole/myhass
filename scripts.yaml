    entity_id: zone.home
    above: 0
  - condition: state
    entity_id: binary_sensor.bedroom_window_contact
    state: 'off'
  - action: script.air_purifier
    metadata: {}
    data:
      mode: '{{mode}}'
  fields:
    mode:
      selector:
        select:
          options:
          - turbo
          - medium
          - sleep
          - 'off'
      name: Mode
      required: true
  alias: Air Purifier if window closed
  description: ''
set_light_brightness:
  sequence:
  - repeat:
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ is_state(repeat.item, ''on'') }}'
          sequence:
          - data:
              brightness_pct: '{{brightness}}'
              transition: 60
            target:
              entity_id: '{{repeat.item}}'
            action: light.turn_on
          alias: Light is on
        - conditions:
          - condition: template
            value_template: '{{ is_state(repeat.item, ''off'') }}'
          sequence:
          - data:
              brightness_pct: '{{brightness}}'
            target:
              entity_id: '{{repeat.item}}'
            action: light.turn_on
          - delay:
              hours: 0
              minutes: 0
              seconds: 1
              milliseconds: 0
          - data: {}
            action: light.turn_off
            target:
              entity_id: '{{repeat.item}}'
          alias: Light is off
      for_each: '{{entities}}'
  alias: Set Light Brightness
  mode: queued
  fields:
    brightness:
      selector:
        number:
          min: 0
          max: 100
      name: Brightness (in %)
      required: true
    entities:
      selector:
        entity:
          multiple: true
      required: true
      name: Entity
  description: ''
  max: 10
