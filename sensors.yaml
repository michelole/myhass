  - platform: history_stats
    name: Bathroom Window OPEN today
    entity_id: binary_sensor.bathroom_window_contact
    state: "on"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"
  
