esphome:
  name: vindriktning
  friendly_name: vindriktning

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:


ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret wifi_domain

captive_portal:


# Ikea Vindriktning PM2.5 sensor
uart:
  rx_pin: D4
  baud_rate: 9600

sensor:
  - platform: pm1006
    pm_2_5:
      name: "Ikea Vindriktning PM25"
      filters:
        - sliding_window_moving_average:
            window_size: 15
            send_every: 15
    