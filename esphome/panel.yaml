esphome:
  name: "panel"

esp8266:
  # restore_from_flash: true
  board: nodemcuv2

# Enable logging
logger:

# Enable Home Assistant API
api:


ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret wifi_domain
  #enable_mdns: false
  
switch:
  - platform: safe_mode
    name: "Panel Safe Mode"

light:
