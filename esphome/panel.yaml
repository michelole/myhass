esphome:
  name: "panel"

esp8266:
  # restore_from_flash: true
  board: nodemcuv2

# Enable logging
logger:

# Enable Home Assistant API
api:
  services:
    - service: set_pixel
      variables:
        row: int
        col: int
        r: int
        g: int
        b: int
      then:
        - lambda: |-
            if (row < 0 || row > 7 || col < 0 || col > 7) return;
            int idx = 63 - (row * 8 + col);
            auto *light = static_cast<esphome::light::AddressableLight *>(id(neopixel_panel).get_output());
            (*light)[idx] = esphome::Color(r, g, b);
            light->schedule_show();
    - service: clear_panel
      then:
        - lambda: |-
            auto *light = static_cast<esphome::light::AddressableLight *>(id(neopixel_panel).get_output());
            light->all() = esphome::Color::BLACK;
            light->schedule_show();


ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret wifi_domain
  #enable_mdns: false
  
switch:
  - platform: safe_mode
    name: "Panel Safe Mode"

light:
  - platform: neopixelbus
    variant: WS2812
    pin: GPIO3
    num_leds: 64
    name: "NeoPixel Panel"
    id: neopixel_panel
