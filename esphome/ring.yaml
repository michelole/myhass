esphome:
  name: "ring"
  platform: ESP8266
  board: nodemcuv2

# Enable logging
logger:

# Enable Home Assistant API
api:


ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret wifi_domain
  #enable_mdns: false
  
light:
  - platform: neopixelbus
    variant: WS2811
    pin: GPIO3
    num_leds: 12
    name: "NeoPixel Ring"
    effects:
      - pulse:

