    above: input_number.high_humidity
    for:
      hours: 0
      minutes: 30
      seconds: 0
    trigger: numeric_state
  - entity_id: sensor.kitchen_humidity
    above: input_number.high_humidity
    for:
      hours: 0
      minutes: 30
      seconds: 0
    trigger: numeric_state
  - entity_id: sensor.bedroom_humidity
    above: input_number.high_humidity
    for:
      hours: 0
      minutes: 30
      seconds: 0
    trigger: numeric_state
  - entity_id:
    - sensor.bathroom_tvoc_humidity
    above: input_number.high_humidity
    for:
      hours: 0
      minutes: 30
      seconds: 0
    trigger: numeric_state
  - entity_id: sensor.living_room_humidity
    above: input_number.high_humidity
    for:
      hours: 0
      minutes: 30
      seconds: 0
    trigger: numeric_state
  conditions:
  - condition: time
    after: input_datetime.wake_time
    before: input_datetime.good_night
  actions:
  - data:
      value: High humidity
    target:
      entity_id: input_text.matrix_text
    action: input_text.set_value
  mode: single
- id: '1647779824138'
  alias: Bathroom Humidity
  description: ''
  triggers:
  - entity_id:
    - sensor.bathroom_humidity
    trigger: state
  - entity_id:
    - input_number.brightness
    trigger: state
  conditions:
  - condition: time
    after: input_datetime.wake_time
    before: input_datetime.good_night
  actions:
  - data:
      transition: 60
      brightness_pct: '{{ states(''input_number.brightness'') | int}}'
      hs_color:
      - '{{(states(''sensor.bathroom_humidity'') | float * -6 + 420) % 360}}'
      - 100
    target:
      entity_id: light.bathroom_indicator_light
    enabled: true
    action: light.turn_on
  mode: single
- id: '1648067274319'
  alias: Good evening
  description: ''
  triggers:
  - at: input_datetime.evening_time
    trigger: time
  conditions:
  - condition: numeric_state
    entity_id: zone.home
    above: 0
    enabled: false
  actions:
  - if:
    - condition: numeric_state
      entity_id: zone.home
      above: 0
    then:
    - action: script.dim_lights
      metadata: {}
      data: {}
      enabled: false
    - data:
        value: 25
      target:
        entity_id: input_number.brightness
      action: input_number.set_value
    - data: {}
      action: light.turn_off
      target:
        entity_id:
        - light.bedroom_indicator_light
        - light.bedroom_corner_light
    - action: light.turn_on
      metadata: {}
      target:
        entity_id: light.living_room_tv_backlight
      data:
        transition: 60
        brightness_pct: 10
  mode: single
- id: '1648067336678'
  alias: Good night
  description: ''
  triggers:
  - at: input_datetime.good_night
    trigger: time
  conditions: []
  actions:
  - action: script.asleep
    metadata: {}
    data: {}
  mode: single
- id: '1648067358953'
  alias: Good morning
  description: ''
  triggers:
  - at: input_datetime.wake_time
    trigger: time
    id: home
  conditions:
  - condition: numeric_state
    entity_id: zone.home
    above: 0
    enabled: false
  actions:
  - if:
