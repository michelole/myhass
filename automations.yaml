- id: '1650801918671'
  alias: High bedroom temperature
  description: ''
  triggers:
  - entity_id:
    - sensor.outdoor_temperature
    trigger: state
  - entity_id:
    - sensor.bedroom_temperature
    trigger: state
  conditions:
  - condition: template
    value_template: "{{ states('sensor.outdoor_temperature') | float <\n   states('sensor.bedroom_temperature')
      | float }}"
  - condition: numeric_state
    entity_id: sensor.bedroom_temperature
    above: input_number.high_temp
  - condition: state
    entity_id: binary_sensor.bedroom_window_contact
    state: 'off'
  - condition: time
    before: input_datetime.good_night
    after: '19:00:00'
  - condition: template
    value_template: '{{ (as_timestamp(now()) - as_timestamp(state_attr(this.entity_id,
      ''last_triggered'')) | int > 1800)}}'
  actions:
  - data:
      value: 'Open bedroom window '
    target:
      entity_id: input_text.matrix_text
    action: input_text.set_value
  mode: single
- id: '1651003290126'
  alias: Notify to open living room window
  description: ''
  triggers:
  - entity_id:
    - sensor.outdoor_temperature
    trigger: state
  - entity_id:
    - sensor.living_room_temperature
    trigger: state
  conditions:
  - condition: template
    value_template: "{{ states('sensor.outdoor_temperature') | float <\n   states('sensor.living_room_temperature')
      | float }}"
  - condition: numeric_state
    entity_id: sensor.living_room_temperature
    above: input_number.high_temp
  - condition: state
    entity_id: sensor.outdoor_temperature
    state: 'off'
    enabled: false
  - condition: time
    before: input_datetime.good_night
    after: 08:30:00
    enabled: false
  - condition: template
    value_template: '{{ (as_timestamp(now()) - as_timestamp(state_attr(this.entity_id,
      ''last_triggered'')) | int > 1800)}}'
  actions:
  - data:
      value: Open
    target:
      entity_id: input_text.matrix_text
    action: input_text.set_value
  - action: script.1662825053499
    metadata: {}
    data:
      title: Windows
      body: Open windows
  mode: single
- id: '1655152040831'
  alias: Notify to close living room window
