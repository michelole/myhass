- id: '1648156014807'
  alias: Living Room CO2
  description: ''
  triggers:
  - entity_id:
    - sensor.living_room_co2
    trigger: state
    id: co2
  - entity_id:
    - input_number.brightness
    trigger: state
    id: brightness
  conditions:
  - condition: state
    entity_id: cover.living_room_blind
    state: []
    attribute: is_closed
    enabled: false
  - condition: numeric_state
    entity_id: cover.living_room_blind
    attribute: current_position
    above: 30
  actions:
  - data:
      transition: 60
      brightness_pct: '{{ states(''input_number.brightness'') | int}}'
