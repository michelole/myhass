- id: '1730556526719'
  alias: Halloween
  description: Candle Flicker and Lightning
  triggers:
  - entity_id:
    - input_boolean.halloween_show
    to: 'on'
    trigger: state
  - entity_id:
    - input_boolean.halloween_show
    to: 'off'
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.halloween_show
        state: 'on'
      sequence:
      - repeat:
          sequence:
          - action: light.turn_on
            data:
              brightness_pct: 100
              rgb_color:
              - 255
              - 0
              - 0
            target:
              entity_id: light.indicator_lights
          - delay:
              seconds: '{{ range(30, 60) | random }}'
            enabled: true
          - repeat:
              count: '{{ [3, 5, 7] | random }}'
              sequence:
              - action: light.turn_on
                data:
                  transition: 0
                  brightness: '{{ range(100, 255) | random }}'
                  rgb_color:
                  - 255
                  - 0
                  - 0
                target:
                  entity_id: light.indicator_lights
              - delay:
                  milliseconds: '{{ range(250, 1000) | random }}'
              - action: light.turn_on
                data:
                  transition: 0
                  brightness: '{{ range(100, 255) | random }}'
                  rgb_color:
                  - 255
                  - 0
                  - 0
                target:
                  entity_id: light.indicator_lights
              - delay:
                  milliseconds: '{{ range(250, 1000) | random }}'
          - action: light.turn_on
            data:
              brightness_pct: 100
              rgb_color:
              - 255
              - 0
              - 0
            target:
              entity_id: light.indicator_lights
          while:
          - condition: state
            entity_id: input_boolean.halloween_show
            state: 'on'
    - conditions:
      - condition: state
        entity_id: input_boolean.halloween_show
        state: 'off'
      sequence:
      - action: light.turn_on
        data:
          rgb_color:
          - 255
          - 0
          - 0
          brightness_pct: 100
        target:
          entity_id: light.indicator_lights
  mode: restart
