- id: '1793657654142'
  alias: Bathroom Climate Sync
  description: ''
  triggers:
  - trigger: state
    entity_id: climate.bathroom_thermostat
    id: climate_state
  - trigger: state
    entity_id: climate.bathroom_climate_sensor
    id: w100_climate_state
  - trigger: state
    entity_id: sensor.outdoor_temperature
    id: ext_temp
    enabled: true
  - trigger: state
    entity_id: sensor.outdoor_humidity
    id: ext_hum
    enabled: true
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - climate_state
      - condition: template
        value_template: '{{ is_state(thermostat_mode_switch, ''on'') }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ states(main_thermostat) != states(aqara_w100) }}'
        - condition: template
          value_template: '{{ is_state(thermostat_mode_switch, ''on'') }}'
        then:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.bathroom_climate_sensor
          data:
            hvac_mode: '{{ states(main_thermostat) }}

              '
        - delay:
            seconds: '{{ sync_delay }}'
      - if:
        - condition: template
          value_template: '{{ state_attr(main_thermostat, "temperature") != state_attr(aqara_w100,
            "temperature") }}'
        then:
        - action: climate.set_temperature
          target:
            entity_id: climate.bathroom_climate_sensor
          data:
            temperature: '{{ state_attr(main_thermostat, "temperature") }}

              '
        - delay:
            seconds: '{{ sync_delay }}'
      - if:
        - condition: template
          value_template: "{# Define the variables#} {% set source = state_attr(main_thermostat,
            \"fan_mode\") %} {% set target = state_attr(aqara_w100, \"fan_mode\")
            %} {# Normalize the source to lowercase and map med->medium for comparison
            #} {% set source_norm = 'medium' if source | lower == 'med' else source
            | lower %} {# Compare normalized values #} {{ \n  (source_norm != target)
