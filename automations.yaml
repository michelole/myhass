- id: '1776535925574'
  alias: 'Living Room GrowCube Plant Watering '
  description: Waters channels A-D in parallel at 8 PM if moisture is low, capped
    at 10 repeats.
  triggers:
  - at: '19:00:00'
    trigger: time
  conditions:
  - condition: state
    entity_id: binary_sensor.growcube_problem
    state:
    - 'off'
  actions:
  - parallel:
    - if:
      - condition: template
        value_template: '{{ states(''sensor.growcube_c71437_moisture_a'') | float(0)
          < threshold_start }}'
      then:
      - repeat:
          sequence:
          - action: growcube.water_plant
            data:
              duration: '{{ water_duration }}'
              device_id: 839993b25431f678c499a03189f26af9
              channel: A
          - delay: '{{ rest_interval }}'
          until:
          - condition: or
            conditions:
            - condition: template
              value_template: '{{ states(''sensor.growcube_c71437_moisture_a'') |
                float(0) > threshold_stop }}'
            - condition: template
              value_template: '{{ repeat.index >= max_repeats }}'
      enabled: true
    - if:
      - condition: template
        value_template: '{{ states(''sensor.growcube_c71437_moisture_b'') | float(0)
          <= threshold_start }}'
      then:
      - repeat:
          sequence:
          - action: growcube.water_plant
            data:
              duration: '{{ water_duration }}'
              device_id: 839993b25431f678c499a03189f26af9
              channel: B
          - delay: '{{ rest_interval }}'
          until:
          - condition: or
            conditions:
            - condition: template
              value_template: '{{ states(''sensor.growcube_c71437_moisture_b'') |
                float(0) > threshold_stop }}'
            - condition: template
              value_template: '{{ repeat.index >= max_repeats }}'
    - if:
      - condition: template
        value_template: '{{ states(''sensor.growcube_c71437_moisture_c'') | float(0)
          <= threshold_start }}'
      then:
      - repeat:
          sequence:
          - action: growcube.water_plant
            data:
              duration: '{{ water_duration }}'
              device_id: 839993b25431f678c499a03189f26af9
              channel: C
          - delay: '{{ rest_interval }}'
          until:
          - condition: or
            conditions:
            - condition: template
              value_template: '{{ states(''sensor.growcube_c71437_moisture_c'') |
                float(0) > threshold_stop }}'
            - condition: template
              value_template: '{{ repeat.index >= max_repeats }}'
    - if:
      - condition: template
        value_template: '{{ states(''sensor.growcube_c71437_moisture_d'') | float(0)
          <= threshold_start }}'
      then:
      - repeat:
          sequence:
          - action: growcube.water_plant
            data:
              duration: '{{ water_duration }}'
              device_id: 839993b25431f678c499a03189f26af9
              channel: D
          - delay: '{{ rest_interval }}'
          until:
          - condition: or
            conditions:
            - condition: template
              value_template: '{{ states(''sensor.growcube_c71437_moisture_d'') |
                float(0) > threshold_stop }}'
            - condition: template
              value_template: '{{ repeat.index >= max_repeats }}'
  variables:
    threshold_start: 1
    threshold_stop: 25
    water_duration: 5
    rest_interval: 60
    max_repeats: 20
  mode: single
