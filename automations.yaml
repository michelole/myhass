- id: '1693064067569'
  alias: Battery Low Notification
  description: Battery Low Notification with auto dismiss
  triggers:
  - trigger: event
    event_type: battery_notes_battery_threshold
    event_data:
      battery_low: true
    id: low
    alias: Battery went low
  - trigger: event
    event_type: battery_notes_battery_threshold
    event_data:
      battery_low: false
    id: high
    alias: Battery went high
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - low
      sequence:
      - action: persistent_notification.create
        data:
          title: '{{ trigger.event.data.device_name }} Battery Low

            '
          notification_id: '{{ trigger.event.data.device_id }}-{{ trigger.event.data.source_entity_id
            }}'
          message: 'The device has a battery level of {{ trigger.event.data.battery_level
            }}% {{ ''\n'' -}} You need {{ trigger.event.data.battery_quantity }}×
            {{ trigger.event.data.battery_type }}

            '
        enabled: false
      - action: script.1662825053499
        metadata: {}
        data:
          body: The device has a battery level of {{ trigger.event.data.battery_level
            }}% {{ '\n' -}} You need {{ trigger.event.data.battery_quantity }}× {{
            trigger.event.data.battery_type }}
          title: '{{ trigger.event.data.device_name }} Battery Low'
    - conditions:
      - condition: trigger
        id:
        - high
      sequence:
      - action: persistent_notification.dismiss
        data:
          notification_id: '{{ trigger.event.data.device_id }}-{{ trigger.event.data.source_entity_id
            }}'
  mode: queued
- id: '1693157209787'
  alias: Loggia Heating Boost
  description: ''
  triggers:
  - entity_id:
    - binary_sensor.loggia_window_contact
    for:
      hours: 0
      minutes: 0
      seconds: 30
    trigger: state
    from: 'on'
    to: 'off'
    id: window_closed
  - trigger: light.turned_on
    target:
      entity_id: light.loggia_monitor_light
    options: {}
  - trigger: light.turned_off
    target:
      entity_id: light.loggia_monitor_light
    options: {}
  conditions:
  - condition: numeric_state
    entity_id: zone.home
    above: 0
  - condition: state
    entity_id: binary_sensor.loggia_window_contact
    state: 'off'
    enabled: true
  - condition: time
    after: input_datetime.wake_time
    before: input_datetime.good_night
    enabled: false
  actions:
  - choose:
    - conditions:
      - condition: light.is_on
        target:
          entity_id: light.loggia_monitor_light
        options: {}
      - condition: time
        after: input_datetime.wake_time
        before: input_datetime.good_night
      sequence:
      - delay:
          hours: 0
          minutes: 5
          seconds: 0
          milliseconds: 0
        enabled: false
      - action: climate.set_temperature
        metadata: {}
        target:
          entity_id: climate.loggia_thermostat
        data:
          hvac_mode: heat
          temperature: '{{ states(''input_number.cozy_loggia_temp'') }}'
        enabled: false
      - action: climate.set_preset_mode
        metadata: {}
        target:
          entity_id: climate.loggia_thermostat
        data:
          preset_mode: comfort
      alias: Heating boost
    - conditions:
      - condition: light.is_off
        target:
          entity_id: light.loggia_monitor_light
        options: {}
      sequence:
      - delay:
          hours: 0
          minutes: 5
          seconds: 0
          milliseconds: 0
        enabled: false
      - action: climate.set_temperature
        metadata: {}
        target:
          entity_id: climate.loggia_thermostat
        data:
          hvac_mode: auto
        enabled: false
      - action: climate.set_preset_mode
        metadata: {}
        target:
          entity_id: climate.loggia_thermostat
        data:
          preset_mode: eco
      alias: Heating auto
  mode: restart
- id: '1696754354880'
  alias: Table Light
  description: ''
  triggers:
  - entity_id:
    - binary_sensor.presence_sensor_dining
    to: 'on'
    id: table-detected
    for:
      hours: 0
      minutes: 15
      seconds: 0
    trigger: state
  - entity_id:
    - binary_sensor.presence_sensor_dining
    to: 'off'
    id: table-clear
    for:
      hours: 0
      minutes: 10
      seconds: 0
    trigger: state
  conditions:
  - condition: numeric_state
    entity_id: zone.home
    above: 0
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - table-detected
      sequence:
      - data:
          transition: 30
        target:
          entity_id:
          - light.living_room_table_light
        action: light.turn_on
        enabled: false
    - conditions:
      - condition: trigger
        id:
        - table-clear
      - condition: time
        after: input_datetime.evening_time
        before: input_datetime.wake_time
      sequence:
      - data:
          transition: 60
        target:
          entity_id:
          - light.living_room_table_light
        action: light.turn_off
  mode: restart
- id: '1696757902998'
  alias: Loggia Convection Heater
  description: ''
  triggers:
  - value_template: '{# Target temperature is higher than current (considering hysteresis)
      #} {{ state_attr(''climate.loggia_thermostat'', ''temperature'') | float - states("sensor.loggia_temperature")
      | float > states(''input_number.temperature_hysteresis'') | float}}'
    id: high_target
    trigger: template
    alias: Target temperature is higher than actual
  - value_template: '{# Target temperature is lower than current (considering hysteresis)
      #} {{ state_attr(''climate.loggia_thermostat'', ''temperature'') | float - states("sensor.loggia_temperature")
      | float < states(''input_number.temperature_hysteresis'') | float}}'
    id: lower_target
    trigger: template
    alias: Target temperature is lower than actual
  - entity_id:
    - binary_sensor.loggia_window_contact
    to: 'on'
    id: open_window
    trigger: state
  - trigger: light.turned_off
    target:
      entity_id: light.loggia_monitor_light
    options: {}
    id: light_off
  - trigger: light.turned_on
    target:
      entity_id: light.loggia_monitor_light
    options: {}
    id: light_on
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: zone.home
        above: 0
      - condition: state
        entity_id: binary_sensor.loggia_window_contact
        state: 'off'
        enabled: true
      - condition: template
        value_template: '{# Target temperature is higher than current (considering
          hysteresis) #} {{ state_attr(''climate.loggia_thermostat'', ''temperature'')
          | float - states("sensor.loggia_temperature") | float > states(''input_number.temperature_hysteresis'')
          | float}}'
        alias: Target temperature is higher than actual
      - condition: state
        entity_id: light.loggia_monitor_light
        state: 'on'
      sequence:
      - delay:
          hours: 0
          minutes: 2
          seconds: 0
          milliseconds: 0
      - data: {}
        action: switch.turn_on
        target:
          entity_id: switch.loggia_heater
        enabled: false
      - action: climate.turn_on
        metadata: {}
        target:
          entity_id: climate.loggia_heater
        data: {}
      alias: Heat
    - conditions:
      - condition: trigger
        id:
        - lower_target
        - open_window
        - light_off
      sequence:
      - data: {}
        action: switch.turn_off
        target:
          entity_id: switch.loggia_heater
        enabled: false
      - action: climate.turn_off
        metadata: {}
        target:
          entity_id: climate.loggia_heater
        data: {}
      alias: 'Off'
  mode: restart
