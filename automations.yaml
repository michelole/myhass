            | bool)) or\n    (is_state(aqara_w100, 'off'))\n  )\n}}\n"
        then:
        - action: climate.set_hvac_mode
          data:
            hvac_mode: '{{ states(aqara_w100) }}

              '
          target:
            entity_id: climate.bedroom_thermostat
          enabled: false
        - delay:
            seconds: '{{ sync_delay }}'
        else:
        - if:
          - condition: template
            value_template: "{{\n  (is_state(aqara_w100, 'heat') and not (hvac_has_heat
              | default(false) | bool)) or\n  (is_state(aqara_w100, 'cool') and not
              (hvac_has_cool | default(false) | bool)) or\n  (is_state(aqara_w100,
              'auto') and not (hvac_has_auto | default(false) | bool))\n}}\n"
          then:
          - action: climate.set_hvac_mode
            metadata: {}
            data:
              hvac_mode: heat
            target:
              entity_id: climate.bedroom_climate_sensor
          - delay:
              seconds: '{{ sync_delay }}'
      - if:
        - condition: template
          value_template: '{{ state_attr(main_thermostat, "temperature") != state_attr(aqara_w100,
            "temperature") }}'
        then:
        - action: climate.set_temperature
          data:
            temperature: '{{ state_attr(aqara_w100, "temperature") }}

              '
          target:
            entity_id: climate.bedroom_thermostat
          enabled: false
        - delay:
            seconds: '{{ sync_delay }}'
      - if:
        - condition: template
          value_template: "{# Define the variables#} {% set source = state_attr(main_thermostat,
            \"fan_mode\") %} {% set target = state_attr(aqara_w100, \"fan_mode\")
            %} {# Normalize source to lowercase and map med->medium for comparison
            #} {% set source_norm = 'medium' if source | lower == 'med' else source
            | lower %} {# Compare normalized values #} {{ \n  (source_norm != target)
            and \n  (hvac_has_vent | default(false) | bool) \n}}"
        then:
        - action: climate.set_fan_mode
          target:
            entity_id: climate.bedroom_thermostat
          data:
            fan_mode: "{% set source = state_attr(aqara_w100, \"fan_mode\") %}\n{%
              set target_valid_list = state_attr(main_thermostat, \"fan_modes\") %}\n\n{#
              If source is med/medium, find the target's specific medium mode #}\n{%
              if source | lower == 'med' or source | lower == 'medium' %}\n  {{ target_valid_list
              | select('search', '(?i)^med') | first | default(source) }}\n  \n{#
              Otherwise just pass the source through #}\n{% else %}\n  {{ source }}\n{%
              endif %}\n"
          enabled: false
        - delay:
            seconds: '{{ sync_delay }}'
    - conditions:
      - condition: trigger
        id:
        - ext_temp
        - ext_hum
      - condition: template
        value_template: '{{ enable_external_data }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ states(external_temperature_sensor) not in [''unknown'',
            ''unavailable''] }}'
        then:
        - action: number.set_value
          target:
            entity_id: '{{ ''number.'' ~ aqara_w100.split(''.'')[1] ~ ''_external_temperature''
              }}'
          data:
            value: '{{ states(external_temperature_sensor) | float }}

              '
        - delay:
            seconds: '{{ sync_delay }}'
      - if:
        - condition: template
          value_template: '{{ states(external_humidity_sensor) not in [''unknown'',
            ''unavailable''] }}'
        then:
        - action: number.set_value
          target:
            entity_id: '{{ ''number.'' ~ aqara_w100.split(''.'')[1] ~ ''_external_humidity''
              }}'
          data:
            value: '{{ states(external_humidity_sensor) | float }}

              '
        - delay:
            seconds: '{{ sync_delay }}'
  variables:
    main_thermostat: climate.bedroom_thermostat
    aqara_w100: climate.bedroom_climate_sensor
    hvac_has_heat: true
    hvac_has_cool: false
    hvac_has_auto: false
    hvac_has_vent: false
    sync_delay: 2
    enable_external_data: true
    external_temperature_sensor: sensor.outdoor_temperature
    external_humidity_sensor: sensor.outdoor_humidity
    thermostat_mode_switch: '{{ ''switch.'' ~ aqara_w100.split(''.'')[1] ~ ''_thermostat_mode''
      }}'
  mode: queued
  max: 10
