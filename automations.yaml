        %} {% set next_8_hours = forecast_list[:8] %} {% set times = namespace(list=[])
        %} {% for hour in next_8_hours %}\n  {% if 'rainy' in hour.condition or 'pouring'
        in hour.condition %}\n    {% set times.list = times.list + [as_timestamp(hour.datetime)
        | timestamp_custom('%-I %p')] %}\n  {% endif %}\n{% endfor %} {{ times.list
        | unique | join(', ') }}\n"
