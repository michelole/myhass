views:
  - title: Temperature
    badges: []
    cards: []
    type: sections
    sections:
      - type: grid
        cards:
          - type: custom:auto-entities
            card:
              type: grid
              columns: 2
              square: false
            card_param: cards
            filter:
              include:
                - domain: sensor
                  name: '*Weather*'
                  options:
                    type: gauge
                    needle: true
                    min: 10
                    max: 40
                    segments:
                      - from: 0
                        color: var(--info-color)
                      - from: 20
                        color: var(--success-color)
                      - from: 25
                        color: var(--warning-color)
                      - from: 30
                        color: var(--error-color)
                  attributes:
                    device_class: temperature
              exclude:
                - options: {}
                  hidden_by: '*'
                - options: {}
                  state: unavailable
                - options: {}
                  state: unknown
                - options: {}
                  entity_category: diagnostic
                - options: {}
                  name: '*(Dew|Feels)*'
            sort:
              method: state
              numeric: true
              reverse: true
      - type: grid
        cards:
          - type: custom:auto-entities
            card:
              chart_type: line
              period: 5minute
              type: statistics-graph
              stat_types:
                - mean
                - min
                - max
              days_to_show: 0.05
              title: Minutely
            filter:
              include:
                - options: {}
                  domain: sensor
                  name: '*[Ww]eather*'
                  attributes:
                    device_class: temperature
              exclude:
                - options: {}
                  hidden_by: '*'
                - options: {}
                  state: unavailable
                - options: {}
                  state: unknown
                - options: {}
                  entity_category: diagnostic
                - options: {}
                  name: '*(Dew|Feels)*'
          - type: custom:auto-entities
