              stat_types:
                - mean
                - min
                - max
              days_to_show: 365
              title: Weekly
            filter:
              include:
                - options: {}
                  domain: sensor
                  name: '*[Ww]eather*'
                  attributes:
                    device_class: temperature
              exclude:
                - options: {}
                  hidden_by: '*'
                - options: {}
                  state: unavailable
                - options: {}
                  state: unknown
                - options: {}
                  entity_category: diagnostic
                - options: {}
