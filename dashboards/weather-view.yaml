                - options: {}
                  domain: sensor
                  name: '*[Ww]eather*'
                  attributes:
                    device_class: temperature
              exclude:
                - options: {}
                  hidden_by: '*'
                - options: {}
                  state: unavailable
                - options: {}
                  state: unknown
                - options: {}
                  entity_category: diagnostic
                - options: {}
                  name: '*(Dew|Feels)*'
          - type: custom:auto-entities
