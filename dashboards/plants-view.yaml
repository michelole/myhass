  - title: Illuminance
    badges: []
    cards: []
    type: sections
    sections:
      - type: grid
        cards:
          - type: custom:auto-entities
            card:
              type: grid
              columns: 2
              square: false
            card_param: cards
            filter:
              include:
                - domain: sensor
                  name: Plant*
                  attributes:
                    device_class: illuminance
                  options:
                    type: gauge
                    max: 60000
                    segments:
                      - from: 0
                        color: red
                      - from: 15000
                        color: yellow
                      - from: 30000
                        color: green
              exclude:
                - hidden_by: '*'
                - state: unavailable
            sort:
              method: state
              numeric: true
              reverse: false
      - type: grid
        cards:
          - type: custom:auto-entities
            card:
              chart_type: line
              period: hour
              type: statistics-graph
              stat_types:
                - mean
              days_to_show: 1
              min_y_axis: 0
              title: Hourly
            filter:
              include:
                - options: {}
                  domain: sensor
                  name: Plant*
                  attributes:
                    device_class: illuminance
              exclude:
                - options: {}
                  hidden_by: '*'
                - options: {}
                  state: unavailable
          - type: custom:auto-entities
            card:
              chart_type: line
              period: day
              type: statistics-graph
              stat_types:
                - mean
              min_y_axis: 0
              title: Daily
              days_to_show: 30
              max_y_axis: 8000
            filter:
              include:
                - options: {}
                  domain: sensor
                  name: Plant*
                  attributes:
                    device_class: illuminance
              exclude:
                - options: {}
                  hidden_by: '*'
                - options: {}
                  state: unavailable
          - type: custom:auto-entities
            card:
              chart_type: line
              period: week
              type: statistics-graph
              stat_types:
                - mean
              min_y_axis: 0
              days_to_show: 365
              title: Weekly
              max_y_axis: 8000
            filter:
              include:
                - options: {}
                  domain: sensor
                  name: Plant*
                  attributes:
                    device_class: illuminance
              exclude:
                - options: {}
                  hidden_by: '*'
                - options: {}
                  state: unavailable
          - type: custom:auto-entities
            card:
              chart_type: line
              period: month
              type: statistics-graph
              stat_types:
                - mean
              min_y_axis: 0
              title: Monthly
              days_to_show: 730
              max_y_axis: 8000
            filter:
              include:
                - options: {}
                  domain: sensor
                  name: Plant*
                  attributes:
                    device_class: illuminance
              exclude:
                - options: {}
                  hidden_by: '*'
                - options: {}
                  state: unavailable
        column_span: 1
    max_columns: 4
  - theme: Backend-selected
    title: Status
    badges: []
    cards: []
    type: sections
    sections:
      - type: grid
        cards:
          - type: plant-status
            entity: plant.aglaonema
            name: Aglaonema
          - type: plant-status
            entity: plant.epipremnum
            name: Epipremnum
          - type: plant-status
            entity: plant.monstera
            name: Monstera
          - type: plant-status
            entity: plant.pachira
            name: Pachira
