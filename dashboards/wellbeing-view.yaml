views:
  - title: Temperature
    badges: []
    cards: []
    type: sections
    sections:
      - type: grid
        cards:
          - type: custom:auto-entities
            card:
              type: grid
              columns: 2
              square: false
            card_param: cards
            filter:
              include:
                - domain: sensor
                  label: allowlist
                  options:
                    type: gauge
                    needle: true
                    min: 10
                    max: 40
                    segments:
                      - from: 0
                        color: var(--info-color)
                      - from: 20
                        color: var(--success-color)
                      - from: 25
                        color: var(--warning-color)
                      - from: 30
                        color: var(--error-color)
                  attributes:
                    device_class: temperature
              exclude:
                - options: {}
                  hidden_by: '*'
                - options: {}
                  state: unavailable
                - options: {}
                  entity_category: diagnostic
                - options: {}
                  name: '*Heater*'
            sort:
              method: state
              numeric: true
              reverse: true
      - type: grid
        cards:
          - type: custom:auto-entities
            card:
              chart_type: line
              period: 5minute
              type: statistics-graph
              stat_types:
                - mean
              title: Minutely
              days_to_show: 0.05
            filter:
              include:
                - options: {}
                  label: allowlist
                  domain: sensor
                  attributes:
                    device_class: temperature
                - options: {}
              exclude:
                - options: {}
                  hidden_by: '*'
                - options: {}
                  state: unavailable
                - options: {}
                  entity_category: diagnostic
                - options: {}
                  name: '*Heater*'
          - type: custom:auto-entities
            card:
              chart_type: line
              period: hour
              type: statistics-graph
              stat_types:
                - mean
              days_to_show: 1
              title: Hourly
            filter:
              include:
                - options: {}
                  label: allowlist
                  domain: sensor
                  attributes:
                    device_class: temperature
                - options: {}
              exclude:
                - options: {}
                  hidden_by: '*'
                - options: {}
                  state: unavailable
                - options: {}
                  entity_category: diagnostic
                - options: {}
                  name: '*Heater*'
          - type: custom:auto-entities
            card:
              chart_type: line
              period: day
              type: statistics-graph
              stat_types:
                - mean
              title: Daily
              days_to_show: 30
            filter:
              include:
                - options: {}
                  domain: sensor
                  label: allowlist
                  attributes:
                    device_class: temperature
              exclude:
                - options: {}
                  hidden_by: '*'
                - options: {}
                  state: unavailable
                - options: {}
                  entity_category: diagnostic
                - options: {}
                  name: '*Heater*'
          - type: custom:auto-entities
            card:
              chart_type: line
              period: week
              type: statistics-graph
              stat_types:
                - mean
              days_to_show: 365
              title: Weekly
            filter:
              include:
                - options: {}
                  label: allowlist
                  domain: sensor
                  attributes:
                    device_class: temperature
              exclude:
                - options: {}
                  hidden_by: '*'
                - options: {}
                  state: unavailable
                - options: {}
                  entity_category: diagnostic
                - options: {}
                  name: '*Heater*'
          - type: custom:auto-entities
            card:
              chart_type: line
              period: month
              type: statistics-graph
              stat_types:
                - mean
              title: Monthly
              days_to_show: 730
            filter:
              include:
                - options: {}
                  label: allowlist
                  domain: sensor
                  attributes:
                    device_class: temperature
              exclude:
                - options: {}
                  hidden_by: '*'
                - options: {}
                  state: unavailable
                - options: {}
                  entity_category: diagnostic
                - options: {}
                  name: '*Heater*'
        column_span: 1
    max_columns: 4
