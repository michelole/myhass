  - title: Noise
    badges: []
    cards: []
    type: sections
    sections:
      - type: grid
        cards:
          - type: custom:auto-entities
            card:
              type: grid
              columns: 2
              square: false
            card_param: cards
            filter:
              include:
                - domain: sensor
                  attributes:
                    device_class: sound_pressure
                  options:
                    type: gauge
                    max: 100
                    severity:
                      green: 0
                      yellow: 70
                      red: 80
              exclude:
                - hidden_by: '*'
                - state: unavailable
            sort:
              method: state
              numeric: true
              reverse: true
      - type: grid
        cards:
          - type: custom:auto-entities
            card:
              chart_type: line
              period: hour
              type: statistics-graph
              stat_types:
                - mean
                - min
                - max
              days_to_show: 1
              min_y_axis: 0
              max_y_axis: 100
              title: Hourly
            filter:
              include:
                - domain: sensor
                  attributes:
                    device_class: sound_pressure
          - type: custom:auto-entities
            card:
              chart_type: line
              period: day
              type: statistics-graph
              stat_types:
                - mean
                - min
                - max
              min_y_axis: 0
              max_y_axis: 100
              title: Daily
              days_to_show: 30
            filter:
              include:
                - domain: sensor
                  attributes:
                    device_class: sound_pressure
          - type: custom:auto-entities
            card:
              chart_type: line
              period: week
              type: statistics-graph
              stat_types:
                - mean
                - min
                - max
              min_y_axis: 0
              max_y_axis: 100
              days_to_show: 365
              title: Weekly
            filter:
              include:
                - domain: sensor
                  attributes:
                    device_class: sound_pressure
          - type: custom:auto-entities
            card:
              chart_type: line
              period: month
              type: statistics-graph
              stat_types:
                - mean
                - min
                - max
              min_y_axis: 0
              title: Monthly
              days_to_show: 730
            filter:
              include:
                - domain: sensor
                  attributes:
                    device_class: sound_pressure
        column_span: 1
    max_columns: 4
  - title: Illuminance
    badges: []
    cards: []
    type: sections
    sections:
      - type: grid
        cards:
          - type: custom:auto-entities
            card:
              type: grid
              columns: 2
              square: false
            card_param: cards
            filter:
              include:
                - domain: sensor
                  attributes:
                    device_class: illuminance
                  options:
                    type: gauge
                    max: 60000
                    segments:
                      - from: 0
                        color: red
                      - from: 15000
                        color: yellow
                      - from: 30000
                        color: green
              exclude:
                - hidden_by: '*'
                - state: unavailable
            sort:
              method: state
              numeric: true
              reverse: false
      - type: grid
        cards:
          - type: custom:auto-entities
            card:
              chart_type: line
              period: hour
              type: statistics-graph
              stat_types:
                - mean
              days_to_show: 1
              min_y_axis: 0
              title: Hourly
            filter:
              include:
                - domain: sensor
                  attributes:
                    device_class: illuminance
              exclude:
                - hidden_by: '*'
                - state: unavailable
          - type: custom:auto-entities
            card:
              chart_type: line
              period: day
              type: statistics-graph
              stat_types:
                - mean
              min_y_axis: 0
              title: Daily
              days_to_show: 30
              max_y_axis: 8000
            filter:
              include:
                - domain: sensor
                  attributes:
                    device_class: illuminance
              exclude:
                - hidden_by: '*'
                - state: unavailable
          - type: custom:auto-entities
            card:
              chart_type: line
              period: week
              type: statistics-graph
              stat_types:
                - mean
              min_y_axis: 0
              days_to_show: 365
              title: Weekly
              max_y_axis: 8000
            filter:
              include:
                - domain: sensor
                  attributes:
                    device_class: illuminance
              exclude:
                - hidden_by: '*'
                - state: unavailable
          - type: custom:auto-entities
            card:
              chart_type: line
              period: month
              type: statistics-graph
              stat_types:
                - mean
              min_y_axis: 0
              title: Monthly
              days_to_show: 730
              max_y_axis: 8000
            filter:
              include:
                - domain: sensor
                  attributes:
                    device_class: illuminance
              exclude:
                - hidden_by: '*'
                - state: unavailable
        column_span: 1
    max_columns: 4
