views:
  - title: System
    path: system
    type: sections
    sections:
      - type: grid
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: gauge
                entity: sensor.processor_use
                name: Processor Use
                needle: true
                min: 0
                max: 100
                segments:
                  - from: 0
                    color: var(--success-color)
                  - from: 60
                    color: var(--warning-color)
                  - from: 85
                    color: var(--error-color)
              - type: gauge
                entity: sensor.processor_temperature
                name: Processor Temp
                needle: true
                min: 20
                max: 90
                segments:
                  - from: 20
                    color: var(--info-color)
                  - from: 40
                    color: var(--success-color)
                  - from: 65
                    color: var(--warning-color)
                  - from: 80
                    color: var(--error-color)
              - type: gauge
                entity: sensor.disk_use_percent_config
                name: Disk Use
                needle: true
                min: 0
                max: 100
                segments:
                  - from: 0
                    color: var(--success-color)
                  - from: 70
                    color: var(--warning-color)
                  - from: 90
                    color: var(--error-color)
              - type: entity
                entity: sensor.memory_free
                name: Memory Free
      - type: grid
        cards:
          - type: statistics-graph
            title: Minutely
            chart_type: line
            period: 5minute
            days_to_show: 0.05
            stat_types:
              - mean
            entities:
              - sensor.processor_use
              - sensor.processor_temperature
              - sensor.disk_use_percent_config
          - type: statistics-graph
            title: Hourly
            chart_type: line
            period: hour
            days_to_show: 1
            stat_types:
              - mean
            entities:
              - sensor.processor_use
              - sensor.processor_temperature
              - sensor.disk_use_percent_config
              - sensor.memory_free
          - type: statistics-graph
            title: Daily
            chart_type: line
            period: day
            days_to_show: 30
            stat_types:
              - mean
            entities:
              - sensor.processor_use
              - sensor.processor_temperature
              - sensor.disk_use_percent_config
              - sensor.memory_free
          - type: statistics-graph
            title: Weekly
            chart_type: line
            period: week
            days_to_show: 365
            stat_types:
              - mean
            entities:
              - sensor.processor_use
              - sensor.processor_temperature
              - sensor.disk_use_percent_config
              - sensor.memory_free

  - title: Entities
    path: entities
    type: sections
