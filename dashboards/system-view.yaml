views:
  - title: System
    path: system
    type: sections
    sections:
      - type: grid
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: gauge
                entity: sensor.processor_use
                name: Processor Use
                needle: true
                min: 0
                max: 100
                segments:
                  - from: 0
                    color: var(--success-color)
                  - from: 60
                    color: var(--warning-color)
                  - from: 85
                    color: var(--error-color)
              - type: gauge
                entity: sensor.processor_temperature
                name: Processor Temp
                needle: true
                min: 20
                max: 90
                segments:
                  - from: 20
                    color: var(--info-color)
                  - from: 40
                    color: var(--success-color)
                  - from: 65
                    color: var(--warning-color)
                  - from: 80
                    color: var(--error-color)
              - type: gauge
                entity: sensor.disk_use_percent_config
                name: Disk Use
                needle: true
                min: 0
                max: 100
                segments:
                  - from: 0
                    color: var(--success-color)
                  - from: 70
                    color: var(--warning-color)
                  - from: 90
                    color: var(--error-color)
              - type: gauge
                entity: sensor.system_monitor_memory_use
                name: Memory Use
                needle: true
                min: 0
                max: 100
                segments:
                  - from: 0
                    color: var(--success-color)
                  - from: 70
                    color: var(--warning-color)
                  - from: 90
                    color: var(--error-color)
      - type: grid
        cards:
          - type: statistics-graph
            title: Minutely
            chart_type: line
            period: 5minute
            days_to_show: 0.05
            stat_types:
              - mean
            entities:
              - sensor.processor_use
              - sensor.processor_temperature
              - sensor.disk_use_percent_config
          - type: statistics-graph
            title: Hourly
            chart_type: line
            period: hour
            days_to_show: 1
            stat_types:
              - mean
            entities:
              - sensor.processor_use
              - sensor.processor_temperature
              - sensor.disk_use_percent_config
              - sensor.system_monitor_memory_use
          - type: statistics-graph
            title: Daily
            chart_type: line
            period: day
            days_to_show: 30
            stat_types:
              - mean
            entities:
              - sensor.processor_use
              - sensor.processor_temperature
              - sensor.disk_use_percent_config
              - sensor.system_monitor_memory_use
          - type: statistics-graph
            title: Weekly
            chart_type: line
            period: week
            days_to_show: 365
            stat_types:
              - mean
            entities:
              - sensor.processor_use
              - sensor.processor_temperature
              - sensor.disk_use_percent_config
              - sensor.system_monitor_memory_use

  - title: Entities
    path: entities
    type: sections
    sections:
      - type: grid
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: gauge
                entity: sensor.entities
                name: Entities
                min: 0
                max: 3000
              - type: gauge
                entity: sensor.devices
                name: Devices
                min: 0
                max: 500
              - type: gauge
                entity: sensor.integrations
                name: Integrations
                min: 0
                max: 200
              - type: gauge
                entity: sensor.sensors
                name: Sensors
                min: 0
                max: 1500
              - type: gauge
                entity: sensor.binary_sensors
                name: Binary Sensors
                min: 0
                max: 500
              - type: gauge
                entity: sensor.switches
                name: Switches
                min: 0
                max: 500
              - type: gauge
                entity: sensor.lights
                name: Lights
                min: 0
                max: 100
              - type: gauge
                entity: sensor.buttons
                name: Buttons
                min: 0
                max: 300
              - type: gauge
                entity: sensor.automations
                name: Automations
                min: 0
                max: 200
              - type: gauge
                entity: sensor.device_trackers
                name: Device Trackers
                min: 0
                max: 100
              - type: gauge
                entity: sensor.count_unavailable_entities
                name: Unavailable Entities
                needle: true
                min: 0
                max: 500
                segments:
                  - from: 0
                    color: var(--success-color)
                  - from: 100
                    color: var(--warning-color)
                  - from: 250
                    color: var(--error-color)
      - type: grid
        cards:
          - type: statistics-graph
            title: Minutely
            chart_type: line
            period: 5minute
            days_to_show: 0.05
            stat_types:
              - mean
            entities:
              - sensor.count_unavailable_entities
          - type: statistics-graph
            title: Hourly
            chart_type: line
            period: hour
            days_to_show: 1
            stat_types:
              - state
            entities:
              - sensor.entities
              - sensor.sensors
              - sensor.binary_sensors
              - sensor.switches
              - sensor.buttons
              - sensor.automations
              - sensor.devices
              - sensor.integrations
              - sensor.device_trackers
              - sensor.lights
          - type: statistics-graph
            title: Daily
            chart_type: line
            period: day
            days_to_show: 30
            stat_types:
              - mean
            entities:
              - sensor.count_unavailable_entities
          - type: statistics-graph
            title: Weekly
            chart_type: line
            period: week
            days_to_show: 365
            stat_types:
              - state
            entities:
              - sensor.entities
              - sensor.sensors
              - sensor.binary_sensors
              - sensor.switches
              - sensor.buttons
              - sensor.automations
              - sensor.devices
              - sensor.integrations
              - sensor.device_trackers
              - sensor.lights

  - title: Zigbee
    path: zigbee
    type: sections
    sections:
      - type: grid
        cards:
          - type: gauge
            entity: sensor.unavailable_zigbee_devices
            name: Unavailable Zigbee Devices
            needle: true
            min: 0
            max: 30
            segments:
              - from: 0
                color: var(--success-color)
              - from: 5
                color: var(--warning-color)
              - from: 15
                color: var(--error-color)
      - type: grid
        cards:
          - type: statistics-graph
            title: Minutely
            chart_type: line
            period: 5minute
            days_to_show: 0.05
            stat_types:
              - mean
            entities:
              - sensor.unavailable_zigbee_devices
          - type: statistics-graph
            title: Hourly
            chart_type: line
            period: hour
            days_to_show: 1
            stat_types:
              - mean
            entities:
              - sensor.unavailable_zigbee_devices
          - type: statistics-graph
            title: Daily
            chart_type: line
            period: day
            days_to_show: 30
            stat_types:
              - mean
            entities:
              - sensor.unavailable_zigbee_devices
          - type: statistics-graph
            title: Weekly
            chart_type: line
            period: week
            days_to_show: 365
            stat_types:
              - mean
            entities:
              - sensor.unavailable_zigbee_devices

  - title: Watchman
    path: watchman
    type: sections
    sections:
      - type: grid
        cards:
          - show_name: true
            show_icon: true
            type: button
            icon: mdi:shield
            tap_action:
              action: call-service
              service: watchman.report
              target: {}
              data:
                create_file: true
            name: Watchman report
          - type: grid
            columns: 2
            square: false
            cards:
              - type: gauge
                entity: sensor.watchman_missing_entities
                name: Missing Entities
                needle: true
                min: 0
                max: 50
                segments:
                  - from: 0
                    color: var(--success-color)
                  - from: 5
                    color: var(--warning-color)
                  - from: 20
                    color: var(--error-color)
              - type: gauge
                entity: sensor.watchman_missing_actions
                name: Missing Actions
                needle: true
                min: 0
                max: 20
                segments:
                  - from: 0
                    color: var(--success-color)
                  - from: 1
                    color: var(--warning-color)
                  - from: 5
                    color: var(--error-color)
      - type: grid
        cards:
          - type: statistics-graph
            title: Minutely
            chart_type: line
            period: 5minute
            days_to_show: 0.05
            stat_types:
              - mean
            entities:
              - sensor.watchman_missing_entities
              - sensor.watchman_missing_actions
          - type: statistics-graph
            title: Hourly
            chart_type: line
            period: hour
            days_to_show: 1
            stat_types:
              - mean
            entities:
              - sensor.watchman_missing_entities
              - sensor.watchman_missing_actions
          - type: statistics-graph
            title: Daily
            chart_type: line
            period: day
            days_to_show: 30
            stat_types:
              - mean
            entities:
              - sensor.watchman_missing_entities
              - sensor.watchman_missing_actions
          - type: statistics-graph
            title: Weekly
            chart_type: line
            period: week
            days_to_show: 365
            stat_types:
              - mean
            entities:
              - sensor.watchman_missing_entities
              - sensor.watchman_missing_actions
