  - title: Watchman
    path: watchman
    type: sections
    sections:
      - type: grid
        cards:
          - show_name: true
            show_icon: true
            type: button
            icon: mdi:shield
            tap_action:
              action: call-service
              service: watchman.report
              target: {}
              data:
                create_file: true
            name: Watchman report
          - type: entities
            entities:
              - sensor.watchman_missing_entities
              - sensor.watchman_missing_services
      - type: grid
        cards:
          - type: statistics-graph
            title: Minutely
            chart_type: line
            period: 5minute
            days_to_show: 0.05
            stat_types:
              - mean
            entities:
              - sensor.watchman_missing_entities
              - sensor.watchman_missing_services
          - type: statistics-graph
            title: Hourly
            chart_type: line
            period: hour
            days_to_show: 1
            stat_types:
              - mean
            entities:
              - sensor.watchman_missing_entities
              - sensor.watchman_missing_services
          - type: statistics-graph
            title: Daily
            chart_type: line
            period: day
            days_to_show: 30
            stat_types:
              - mean
            entities:
              - sensor.watchman_missing_entities
              - sensor.watchman_missing_services
          - type: statistics-graph
            title: Weekly
            chart_type: line
            period: week
            days_to_show: 365
            stat_types:
              - mean
            entities:
              - sensor.watchman_missing_entities
              - sensor.watchman_missing_services
