    path: 5-min
    title: 5 min
    cards:
      - chart_type: line
        period: 5minute
        type: statistics-graph
        entities:
          - sensor.watchman_missing_entities
        stat_types:
          - mean
        days_to_show: 1
      - chart_type: line
        period: 5minute
        type: statistics-graph
        entities:
          - sensor.count_entities
          - sensor.count_unknown_entities
          - sensor.count_unavailable_entities
        stat_types:
          - mean
        days_to_show: 1
  - title: Status
    path: status
    cards:
      - show_name: true
        show_icon: true
        type: button
        icon: mdi:shield
        tap_action:
          action: call-service
          service: watchman.report
          target: {}
          data:
            create_file: true
        name: Watchman report
