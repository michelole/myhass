          - type: statistics-graph
            title: Hourly
            chart_type: line
            period: hour
            days_to_show: 1
            stat_types:
              - state
            entities:
              - sensor.entities
              - sensor.sensors
              - sensor.binary_sensors
              - sensor.switches
              - sensor.buttons
              - sensor.automations
              - sensor.devices
              - sensor.integrations
              - sensor.device_trackers
              - sensor.lights
          - type: statistics-graph
            title: Daily
            chart_type: line
            period: day
            days_to_show: 30
            stat_types:
              - mean
            entities:
              - sensor.count_entities
              - sensor.count_unknown_entities
              - sensor.count_unavailable_entities
          - type: statistics-graph
            title: Weekly
            chart_type: line
            period: week
            days_to_show: 365
            stat_types:
              - state
            entities:
              - sensor.entities
              - sensor.sensors
              - sensor.binary_sensors
              - sensor.switches
              - sensor.buttons
              - sensor.automations
              - sensor.devices
              - sensor.integrations
              - sensor.device_trackers
              - sensor.lights

  - title: Zigbee
    path: zigbee
    type: sections
