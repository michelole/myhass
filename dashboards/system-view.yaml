              - sensor.devices
              - sensor.integrations
              - sensor.sensors
              - sensor.binary_sensors
              - sensor.switches
              - sensor.lights
              - sensor.buttons
              - sensor.automations
              - sensor.device_trackers
          - type: entities
            title: Entity Health
            entities:
              - sensor.count_entities
              - sensor.count_unknown_entities
