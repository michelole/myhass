views:
  - theme: Backend-selected
    title: Status
    badges: []
    cards:
      - show_name: true
        show_icon: true
        show_state: true
        type: glance
        entities:
          - entity: binary_sensor.bathroom_window_contact
          - entity: binary_sensor.bedroom_window_contact
          - entity: binary_sensor.kitchen_window_contact
          - entity: binary_sensor.loggia_window_contact
          - entity: binary_sensor.living_room_left_window_contact
          - entity: binary_sensor.living_room_right_window_contact
        state_color: true
      - type: history-graph
        entities:
          - entity: binary_sensor.bathroom_window_contact
            name: Bathroom
          - entity: binary_sensor.bedroom_window_contact
            name: Kitchen
          - entity: binary_sensor.kitchen_window_contact
            name: Living Room
          - entity: binary_sensor.living_room_right_window_contact
            name: Bedroom
          - entity: binary_sensor.loggia_window_contact
        hours_to_show: 24
  - theme: Backend-selected
    title: Statistics
    path: statistics
    badges: []
    cards:
      - chart_type: line
        period: week
        days_to_show: 365
        type: statistics-graph
        entities:
          - sensor.bathroom_window_open_today
        stat_types:
          - max
