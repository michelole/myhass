views:
  - title: CO2
    badges: []
    cards: []
    type: sections
    sections:
      - type: grid
        cards:
          - type: custom:auto-entities
            card:
              type: grid
              columns: 2
              square: false
            card_param: cards
            filter:
              include:
                - domain: sensor
                  label: allowlist
                  attributes:
                    device_class: carbon_dioxide
                  options:
                    type: gauge
                    max: 3000
                    severity:
                      green: 0
                      yellow: 1000
                      red: 2000
              exclude:
                - hidden_by: '*'
                - state: unavailable
            sort:
              method: state
              numeric: true
              reverse: true
      - type: grid
        cards:
          - type: custom:auto-entities
            card:
              chart_type: line
              period: 5minute
              type: statistics-graph
              stat_types:
                - mean
              days_to_show: 0.05
              title: Minutely
            filter:
              include:
                - options: {}
                  domain: sensor
                  label: allowlist
                  attributes:
                    device_class: carbon_dioxide
          - type: custom:auto-entities
            card:
              chart_type: line
              period: hour
              type: statistics-graph
              stat_types:
                - mean
              days_to_show: 1
              title: Hourly
            filter:
              include:
                - options: {}
                  domain: sensor
                  label: allowlist
                  attributes:
                    device_class: carbon_dioxide
          - type: custom:auto-entities
            card:
              chart_type: line
              period: day
              type: statistics-graph
              stat_types:
                - mean
              min_y_axis: 0
              max_y_axis: 3000
              title: Daily
              days_to_show: 30
            filter:
              include:
                - options: {}
                  domain: sensor
                  label: allowlist
                  attributes:
                    device_class: carbon_dioxide
          - type: custom:auto-entities
            card:
              chart_type: line
              period: week
              type: statistics-graph
              stat_types:
                - mean
              min_y_axis: 0
              max_y_axis: 3000
              days_to_show: 365
              title: Weekly
            filter:
              include:
                - options: {}
                  domain: sensor
                  label: allowlist
                  attributes:
                    device_class: carbon_dioxide
          - type: custom:auto-entities
            card:
              chart_type: line
              period: month
              type: statistics-graph
              stat_types:
                - mean
              min_y_axis: 0
              max_y_axis: 3000
              title: Monthly
              days_to_show: 730
            filter:
              include:
                - options: {}
                  domain: sensor
                  label: allowlist
                  attributes:
                    device_class: carbon_dioxide
        column_span: 1
    max_columns: 3
