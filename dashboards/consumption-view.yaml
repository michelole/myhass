views:
  - title: Water
    badges: []
    cards: []
    type: sections
    sections:
      - type: grid
        cards:
          - type: tile
            entity: input_number.cold_water
            vertical: false
            features_position: bottom
          - type: custom:auto-entities
            card:
              type: grid
              columns: 2
              square: false
            card_param: cards
            filter:
              include:
                - domain: sensor
                  name: '*Consumption'
                  attributes:
                    device_class: water
                  options:
                    type: gauge
                    max: 1000
              exclude:
                - hidden_by: '*'
                - state: unavailable
                - entity_category: diagnostic
                - options: {}
                  name: '*target*'
            sort:
              method: state
              numeric: true
              reverse: true
      - type: grid
        cards:
          - type: custom:auto-entities
            card:
              chart_type: line
              period: hour
              type: statistics-graph
              stat_types:
                - change
              days_to_show: 1
              title: Hourly
            filter:
              include:
                - options: {}
                  domain: sensor
                  name: '*Consumption*'
                  attributes:
                    device_class: water
              exclude:
                - options: {}
                  hidden_by: '*'
                - options: {}
                  state: unavailable
                - options: {}
                  entity_category: diagnostic
                - options: {}
                  name: '*target*'
          - type: custom:auto-entities
            card:
              chart_type: line
              period: day
              type: statistics-graph
              stat_types:
                - change
              title: Daily
              days_to_show: 30
            filter:
              include:
                - options: {}
                  domain: sensor
                  name: '*Consumption*'
                  attributes:
                    device_class: water
              exclude:
                - options: {}
                  hidden_by: '*'
                - options: {}
                  state: unavailable
                - options: {}
                  entity_category: diagnostic
                - options: {}
                  name: '*target*'
          - type: custom:auto-entities
            card:
              chart_type: line
              period: week
              type: statistics-graph
              stat_types:
                - change
              days_to_show: 365
              title: Weekly
            filter:
              include:
                - options: {}
                  domain: sensor
                  name: '*Consumption*'
                  attributes:
                    device_class: water
              exclude:
                - options: {}
                  hidden_by: '*'
                - options: {}
                  state: unavailable
                - options: {}
                  entity_category: diagnostic
                - options: {}
                  name: '*target*'
          - type: custom:auto-entities
            card:
              chart_type: line
              period: month
              type: statistics-graph
              stat_types:
                - change
              title: Monthly
              days_to_show: 730
            filter:
              include:
                - options: {}
                  domain: sensor
                  name: '*Consumption*'
                  attributes:
                    device_class: water
              exclude:
                - options: {}
                  hidden_by: '*'
                - options: {}
                  state: unavailable
                - options: {}
                  entity_category: diagnostic
                - options: {}
                  name: '*target*'
        column_span: 1
    max_columns: 4
